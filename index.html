<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powerpuff Word Cloud</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --blossom-pink: #FF3399;
            --bubbles-blue: #33CCFF;
            --buttercup-green: #66FF33;
            --bg-pastel: linear-gradient(135deg, #FFE5F1, #E5F5FF, #E5FFE5);
            --black: #000000;
            --white: #ffffff;
            --comic-border: 4px solid var(--black);
            --hard-shadow: 6px 6px 0px var(--black);
            --button-shadow: 4px 4px 0px var(--black);
        }

        * {
            box-sizing: border-box;
            font-family: 'Nunito', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            font-weight: 900;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-pastel);
            background-attachment: fixed;
            color: var(--black);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100vh;
            padding: 20px;
        }

        .active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #audience-screen {
            position: relative;
        }

        h1 {
            font-size: 2rem;
            text-align: center;
            color: var(--white);
            -webkit-text-stroke: 2px var(--black);
            text-shadow: 4px 4px 0px var(--black);
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        #word-cloud-container {
            width: 90vw;
            height: 70vh;
            background-color: rgba(255, 255, 255, 0.85);
            border: var(--comic-border);
            border-radius: 30px;
            box-shadow: var(--hard-shadow);
            position: relative;
            overflow: hidden;
        }

        #top-words {
            margin-top: 20px;
            font-size: 1rem;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .top-tag {
            background: var(--bubbles-blue);
            color: var(--white);
            padding: 8px 16px;
            border: 3px solid var(--black);
            border-radius: 20px;
            box-shadow: 3px 3px 0px var(--black);
            -webkit-text-stroke: 1px var(--black);
        }

        #admin-panel {
            position: absolute;
            bottom: 10px;
            right: 10px;
            z-index: 100;
        }

        #mobile-screen {
            justify-content: flex-start;
            padding-top: 15%;
        }

        .card {
            border: var(--comic-border);
            border-radius: 25px;
            padding: 30px 20px;
            background: var(--white);
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.1), var(--hard-shadow);
        }

        .card h1 {
            color: var(--blossom-pink);
            font-size: 1.8rem;
        }

        .instruction {
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 25px;
            color: #555;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            background: #f0f0f0;
            border: 3px solid var(--black);
            border-radius: 15px;
            color: var(--black);
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            box-shadow: inset 3px 3px 0px rgba(0,0,0,0.1);
        }

        input[type="text"]:focus {
            background: var(--white);
            border-color: var(--blossom-pink);
        }

        button {
            border: 3px solid var(--black);
            border-radius: 15px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: var(--button-shadow);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--black);
        }

        #submit-btn {
            width: 100%;
            background-color: var(--buttercup-green);
            color: var(--white);
            -webkit-text-stroke: 1px var(--black);
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        #reset-btn {
            font-size: 0.7rem;
            padding: 8px 15px;
            background-color: #ff4d4d;
            color: white;
            border-radius: 10px;
        }

        #feedback-msg {
            margin-top: 15px;
            font-size: 0.85rem;
            min-height: 15px;
            font-weight: 900;
        }

        @keyframes bubble-pop {
            0%   { transform: scale(0); opacity: 0; }
            50%  { transform: scale(1.2); }
            70%  { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        .cloud-word {
            position: absolute;
            white-space: nowrap;
            text-align: center;
            transform-origin: center;
            animation: bubble-pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
            line-height: 1;
        }
    </style>
</head>
<body>

    <div id="audience-screen" class="screen">
        <h1>🍭 TOWNSVILLE CLOUD 💖</h1>
        <div id="word-cloud-container"></div>
        <div id="top-words">TOP 5: Loading...</div>
        <div id="admin-panel">
            <button id="reset-btn" onclick="clearCloud()">RESET DB</button>
        </div>
    </div>

    <div id="mobile-screen" class="screen">
        <div class="card">
            <h1>SUGAR & SPICE</h1>
            <p class="instruction">輸入一個詞語！<br>看看小鎮村的大家在想什麼？</p>
            <input type="text" id="word-input" maxlength="20" placeholder="Type here..." autofocus>
            <button id="submit-btn" onclick="sendWord()">SEND TO TOWN</button>
            <div id="feedback-msg"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://gslpqlnrupulptqntwvz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_qfy-lAoKfieXeU3jkgQ_4A_egK0DSrK";

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let wordCounts = {};
        let currentRole = "audience";

        function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role');

            if (role === 'mobile' || (/Mobi|Android|iPhone/i.test(navigator.userAgent) && role !== 'tv')) {
                currentRole = "mobile";
                document.getElementById('mobile-screen').classList.add('active');
                setupMobileInteractions();
            } else {
                currentRole = "audience";
                document.getElementById('audience-screen').classList.add('active');
                initAudienceCloud();
            }
        }

        function initAudienceCloud() {
            db.from('word_cloud').select('word')
                .then(({ data, error }) => {
                    wordCounts = {};
                    if (data && data.length > 0) {
                        data.forEach(row => {
                            if (row.word) {
                                const cleanWord = row.word.toUpperCase().trim();
                                wordCounts[cleanWord] = (wordCounts[cleanWord] || 0) + 1;
                            }
                        });
                    }
                    renderCloud();
                });

            db.channel('schema-db-changes')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'word_cloud' }, payload => {
                    if (payload.new && payload.new.word) {
                        const newWord = payload.new.word.toUpperCase().trim();
                        wordCounts[newWord] = (wordCounts[newWord] || 0) + 1;
                        renderCloud();
                    }
                })
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'word_cloud' }, () => {
                    wordCounts = {};
                    renderCloud();
                })
                .subscribe();
        }

        function renderCloud() {
            const container = document.getElementById('word-cloud-container');
            container.innerHTML = "";

            const wordsArray = Object.keys(wordCounts).map(word => ({
                text: word,
                size: wordCounts[word]
            })).sort((a, b) => b.size - a.size);

            updateLeaderboard(wordsArray);

            if (wordsArray.length === 0) return;

            const maxCount = Math.max(...wordsArray.map(w => w.size));
            const minCount = Math.min(...wordsArray.map(w => w.size));

            const containerWidth  = container.clientWidth;
            const containerHeight = container.clientHeight;
            const centerX = containerWidth  / 2;
            const centerY = containerHeight / 2;

            const placedBoxes = [];
            const HITBOX_PADDING = 12;

            const ppgColors = ['#FF3399', '#33CCFF', '#66FF33', '#FF9933', '#B84DFF'];

            wordsArray.forEach((wordObj, index) => {
                const el = document.createElement('div');
                el.className = 'cloud-word';
                el.innerText = wordObj.text;

                let fontSize = 20;
                let color = ppgColors[index % ppgColors.length];

                let textStrokeAndShadow = `
                    -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff,
                    4px 4px 0px #000
                `;

                if (index === 0) {
                    fontSize = 90;
                    color = '#FF3399';
                    textStrokeAndShadow = `
                        -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 3px 3px 0 #fff,
                        6px 6px 0px #000
                    `;
                } else {
                    if (wordObj.size === maxCount) {
                        fontSize = 55;
                    } else {
                        const ratio = maxCount === minCount ? 0 : (wordObj.size - minCount) / (maxCount - minCount);
                        if (ratio > 0.5) {
                            fontSize = 40;
                        } else if (ratio > 0.1) {
                            fontSize = 30;
                        } else {
                            fontSize = 22;
                        }
                    }
                }

                el.style.fontSize  = fontSize + 'px';
                el.style.color     = color;
                el.style.textShadow = textStrokeAndShadow;

                container.appendChild(el);
                const wordWidth  = el.offsetWidth;
                const wordHeight = el.offsetHeight;

                let finalX = centerX;
                let finalY = centerY;

                if (index === 0) {
                    finalX = centerX;
                    finalY = centerY;
                    placedBoxes.push({
                        left:   finalX - wordWidth  / 2 - HITBOX_PADDING,
                        right:  finalX + wordWidth  / 2 + HITBOX_PADDING,
                        top:    finalY - wordHeight / 2 - HITBOX_PADDING,
                        bottom: finalY + wordHeight / 2 + HITBOX_PADDING
                    });
                } else {
                    let angle  = index * 137.5 * (Math.PI / 180);
                    let radius = 15;
                    const step = 3;

                    while (true) {
                        let testX = centerX + radius * Math.cos(angle) * 1.5;
                        let testY = centerY + radius * Math.sin(angle);

                        let testBox = {
                            left:   testX - wordWidth  / 2 - HITBOX_PADDING,
                            right:  testX + wordWidth  / 2 + HITBOX_PADDING,
                            top:    testY - wordHeight / 2 - HITBOX_PADDING,
                            bottom: testY + wordHeight / 2 + HITBOX_PADDING
                        };

                        let isOverlapping = false;
                        for (let box of placedBoxes) {
                            if (!(testBox.right < box.left || testBox.left > box.right ||
                                  testBox.bottom < box.top || testBox.top > box.bottom)) {
                                isOverlapping = true;
                                break;
                            }
                        }

                        if (!isOverlapping || radius > Math.max(containerWidth, containerHeight)) {
                            finalX = testX;
                            finalY = testY;
                            placedBoxes.push(testBox);
                            break;
                        }

                        angle  += 0.5;
                        radius += step;
                    }
                }

                el.style.left = (finalX - wordWidth  / 2) + 'px';
                el.style.top  = (finalY - wordHeight / 2) + 'px';
            });
        }

        function updateLeaderboard(wordsArray) {
            const topContainer = document.getElementById('top-words');
            const sorted = [...wordsArray].sort((a, b) => b.size - a.size).slice(0, 5);

            if (sorted.length === 0) {
                topContainer.innerHTML = "TOP 5: AWAITING INPUTS...";
                return;
            }

            topContainer.innerHTML = "TOP 5: " + sorted.map((w, i) => {
                const colors = ['#FF3399', '#33CCFF', '#66FF33', '#FF9933', '#B84DFF'];
                const bg = colors[i % colors.length];
                return `<span class="top-tag" style="background:${bg}">${w.text} (${w.size})</span>`;
            }).join(" ");
        }

        async function sendWord() {
            const inputElement = document.getElementById('word-input');
            const feedback     = document.getElementById('feedback-msg');
            const rawWord      = inputElement.value.trim();

            if (!rawWord) return;

            if (rawWord.split(/\s+/).length > 2) {
                feedback.style.color = "red";
                feedback.innerText   = "🚨 太多字囉！最多兩個詞！";
                return;
            }

            const lastSubmissionTime = localStorage.getItem('last_sub_time');
            const cooldownPeriod     = 5000;

            if (lastSubmissionTime && (Date.now() - lastSubmissionTime < cooldownPeriod)) {
                feedback.style.color = "#FF3399";
                feedback.innerText   = "⏳ 休息一下，5秒後再傳送！";
                return;
            }

            const { error } = await db
                .from('word_cloud')
                .insert([{ word: rawWord }]);

            if (!error) {
                localStorage.setItem('last_sub_time', Date.now());
                feedback.style.color = "#66FF33";
                feedback.innerText   = "✨ 成功傳送至小鎮村！";
                inputElement.value   = "";
                if (navigator.vibrate) navigator.vibrate(50);
            } else {
                feedback.style.color = "red";
                feedback.innerText   = "❌ 傳送失敗，請再試一次。";
            }
        }

        async function clearCloud() {
            if (confirm("要清空小鎮村的記憶嗎？ (Wipe Database?)")) {
                await db
                    .from('word_cloud')
                    .delete()
                    .neq('word', 'placeholder_wiping_trick');
            }
        }

        function setupMobileInteractions() {
            document.getElementById('word-input').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') sendWord();
            });
        }

        window.onload = initApp;
    </script>
</body>
</html>
