<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powerpuff Word Cloud & Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --blossom-pink: #FF3399;
            --bubbles-blue: #33CCFF;
            --buttercup-green: #66FF33;
            --bg-pastel: linear-gradient(135deg, #FFE5F1, #E5F5FF, #E5FFE5);
            --black: #000000;
            --white: #ffffff;
            --comic-border: 4px solid var(--black);
            --hard-shadow: 6px 6px 0px var(--black);
            --button-shadow: 4px 4px 0px var(--black);
        }

        * {
            box-sizing: border-box;
            font-family: 'Nunito', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            font-weight: 900;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-pastel);
            background-attachment: fixed;
            color: var(--black);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100vh;
            padding: 20px;
        }

        .active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #audience-screen {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        #audience-screen h1 {
            position: absolute;
            top: 3vh;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            font-size: 2rem;
            text-align: center;
            color: var(--white);
            -webkit-text-stroke: 2px var(--black);
            text-shadow: 4px 4px 0px var(--black);
            letter-spacing: 2px;
            z-index: 10;
            width: 100%;
        }

        #word-cloud-container {
            width: 90vw;
            height: 70vh;
            background-color: rgba(255, 255, 255, 0.85);
            border: var(--comic-border);
            border-radius: 30px;
            box-shadow: var(--hard-shadow);
            position: relative;
            overflow: hidden;
        }

        #top-words {
            position: absolute;
            bottom: 3vh;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            font-size: 1rem;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 10;
            width: 100%;
        }

        .top-tag {
            background: var(--bubbles-blue);
            color: var(--white);
            padding: 8px 16px;
            border: 3px solid var(--black);
            border-radius: 20px;
            box-shadow: 3px 3px 0px var(--black);
            -webkit-text-stroke: 1px var(--black);
        }

        #mobile-screen {
            justify-content: flex-start;
            padding-top: 15%;
        }

        .card {
            border: var(--comic-border);
            border-radius: 25px;
            padding: 30px 20px;
            background: var(--white);
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.1), var(--hard-shadow);
        }

        .card h1 {
            color: var(--blossom-pink);
            font-size: 1.8rem;
        }

        .instruction {
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 25px;
            color: #555;
            font-weight: bold;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 15px;
            background: #f0f0f0;
            border: 3px solid var(--black);
            border-radius: 15px;
            color: var(--black);
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            box-shadow: inset 3px 3px 0px rgba(0,0,0,0.1);
        }

        input[type="text"]:focus, input[type="password"]:focus {
            background: var(--white);
            border-color: var(--blossom-pink);
        }

        button {
            border: 3px solid var(--black);
            border-radius: 15px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: var(--button-shadow);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--black);
        }

        #submit-btn {
            width: 100%;
            background-color: var(--buttercup-green);
            color: var(--white);
            -webkit-text-stroke: 1px var(--black);
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        #feedback-msg {
            margin-top: 15px;
            font-size: 0.85rem;
            min-height: 15px;
            font-weight: 900;
        }

        /* 👑 頁面 3：全新管理員後台介面樣式 */
        #admin-screen {
            justify-content: flex-start;
            padding: 40px 20px;
            height: auto;
            min-height: 100vh;
            overflow-y: auto;
        }

        .admin-box {
            width: 100%;
            max-width: 650px;
            background: var(--white);
            border: var(--comic-border);
            border-radius: 25px;
            padding: 30px;
            box-shadow: var(--hard-shadow);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--black);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .admin-title {
            font-size: 1.4rem;
            color: var(--blossom-pink);
        }

        #wipe-btn {
            background-color: #ff4d4d;
            color: var(--white);
            font-size: 0.9rem;
            -webkit-text-stroke: 1px var(--black);
        }

        .log-container {
            width: 100%;
            max-height: 50vh;
            overflow-y: auto;
            border: 3px solid var(--black);
            border-radius: 15px;
            background: #fafafa;
            padding: 15px;
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            background: var(--white);
            border: 2px solid var(--black);
            border-radius: 10px;
            padding: 10px 15px;
            margin-bottom: 10px;
            box-shadow: 2px 2px 0px var(--black);
        }

        .log-word-text {
            color: var(--black);
        }

        .log-count {
            background: var(--bubbles-blue);
            color: var(--white);
            padding: 2px 8px;
            border-radius: 8px;
            border: 1px solid var(--black);
            font-size: 0.8rem;
        }

        @keyframes bubble-pop {
            0%   { transform: scale(0); opacity: 0; }
            50%  { transform: scale(1.2); }
            70%  { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        .cloud-word {
            position: absolute;
            white-space: nowrap;
            text-align: center;
            transform-origin: center;
            animation: bubble-pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
            line-height: 1;
        }
    </style>
</head>
<body>

    <div id="audience-screen" class="screen">
        <h1>
            🍭 TOWNSVILLE CLOUD 💖
            <span style="display: block; font-size: 0.85rem; color: #000000; -webkit-text-stroke: 0; text-shadow: none; margin-top: 8px; letter-spacing: 1px;">by CYL: )</span>
        </h1>
        <div id="word-cloud-container"></div>
        <div id="top-words">TOP 5: Loading...</div>
    </div>

    <div id="mobile-screen" class="screen">
        <div class="card">
            <h1> SCM & CS</h1>
            <p class="instruction">Feedback Welcomed! :)</p>
            <input type="text" id="word-input" maxlength="20" placeholder="Type here..." autofocus>
            <button id="submit-btn" onclick="sendWord()">SEND TO TOWN</button>
            <div id="feedback-msg"></div>
        </div>
    </div>

    <div id="admin-screen" class="screen">
        <div class="card" id="admin-login-card">
            <h1>ADMIN LOGIN</h1>
            <p class="instruction">請輸入安全密碼以存取中央系統</p>
            <input type="password" id="admin-pass-input" placeholder="Enter Password...">
            <button id="submit-btn" onclick="verifyAdminPassword()">UNLOCK SYSTEM</button>
            <div id="admin-login-msg" style="margin-top:15px; color:red; font-size:0.8rem;"></div>
        </div>

        <div class="admin-box" id="admin-dashboard" style="display: none;">
            <div class="admin-header">
                <div class="admin-title">SCM & CS CONTROL PANEL</div>
                <button id="wipe-btn" onclick="clearCloud()">WIPE DATABASE</button>
            </div>
            <p style="font-size:0.8rem; margin-bottom:15px; color:#666;">📊 即時接收紀錄清單 (依字頻排序)：</p>
            <div class="log-container" id="admin-log-list">
                </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://gslpqlnrupulptqntwvz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_qfy-lAoKfieXeU3jkgQ_4A_egK0DSrK";

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let wordCounts = {};
        let currentRole = "audience";
        let rawDatabaseRows = []; // 存放完整的原始紀錄陣列

        function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role');

            if (role === 'input' || role === 'mobile' || (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) && role !== 'display' && role !== 'admin')) {
                currentRole = "mobile";
                document.getElementById('mobile-screen').classList.add('active');
                setupMobileInteractions();
            } else if (role === 'admin') {
                // 👑 啟動管理員入口
                currentRole = "admin";
                document.getElementById('admin-screen').classList.add('active');
                // 綁定密碼輸入框的 Enter 鍵防呆
                document.getElementById('admin-pass-input').addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') verifyAdminPassword();
                });
            } else {
                currentRole = "audience";
                document.getElementById('audience-screen').classList.add('active');
                initAudienceCloud();
            }
        }

        // 👑 密碼驗證邏輯
        function verifyAdminPassword() {
            const passInput = document.getElementById('admin-pass-input').value;
            const loginMsg = document.getElementById('admin-login-msg');

            if (passInput === 'scmscm666666') {
                // 密碼正確，隱藏登入盒，攤開主控台
                document.getElementById('admin-login-card').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                // 點火撈取後台資料庫
                initAudienceCloud();
            } else {
                loginMsg.innerText = "🚨 ACCESS DENIED: WRONG PASSWORD!";
                document.getElementById('admin-pass-input').value = "";
            }
        }

        function initAudienceCloud() {
            db.from('word_cloud').select('word')
                .then(({ data, error }) => {
                    wordCounts = {};
                    if (data && data.length > 0) {
                        data.forEach(row => {
                            if (row.word) {
                                const cleanWord = row.word.toUpperCase().trim();
                                wordCounts[cleanWord] = (wordCounts[cleanWord] || 0) + 1;
                            }
                        });
                    }
                    // 根據角色渲染：大螢幕畫雲，後台畫列表
                    if (currentRole === 'admin') {
                        renderAdminLogs();
                    } else {
                        renderCloud();
                    }
                });

            db.channel('schema-db-changes')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'word_cloud' }, payload => {
                    if (payload.new && payload.new.word) {
                        const newWord = payload.new.word.toUpperCase().trim();
                        wordCounts[newWord] = (wordCounts[newWord] || 0) + 1;
                        
                        if (currentRole === 'admin') {
                            renderAdminLogs();
                        } else {
                            renderCloud();
                        }
                    }
                })
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'word_cloud' }, () => {
                    wordCounts = {};
                    if (currentRole === 'admin') {
                        renderAdminLogs();
                    } else {
                        renderCloud();
                    }
                })
                .subscribe();
        }

        // 👑 全新渲染：後台專屬即時紀錄列表
        function renderAdminLogs() {
            const logListContainer = document.getElementById('admin-log-list');
            logListContainer.innerHTML = "";

            const sortedWords = Object.keys(wordCounts).map(word => ({
                text: word,
                size: wordCounts[word]
            })).sort((a, b) => b.size - a.size);

            if (sortedWords.length === 0) {
                logListContainer.innerHTML = "<div style='text-align:center; padding:20px; color:#aaa; font-size:0.8rem;'>AWAITING INCOMING TELEMETRY DATA...</div>";
                return;
            }

            sortedWords.forEach(w => {
                const item = document.createElement('div');
                item.className = 'log-item';
                item.innerHTML = `
                    <span class="log-word-text">${w.text}</span>
                    <span class="log-count">Count: ${w.size}</span>
                `;
                logListContainer.appendChild(item);
            });
        }

        function renderCloud() {
            const container = document.getElementById('word-cloud-container');
            container.innerHTML = "";

            const wordsArray = Object.keys(wordCounts).map(word => ({
                text: word,
                size: wordCounts[word]
            })).sort((a, b) => b.size - a.size);

            updateLeaderboard(wordsArray);

            if (wordsArray.length === 0) return;

            const maxCount = Math.max(...wordsArray.map(w => w.size));
            const minCount = Math.min(...wordsArray.map(w => w.size));

            const containerWidth  = container.clientWidth;
            const containerHeight = container.clientHeight;
            const centerX = containerWidth  / 2;
            const centerY = containerHeight / 2;

            const placedBoxes = [];
            const HITBOX_PADDING = 12;

            const ppgColors = ['#FF3399', '#33CCFF', '#66FF33', '#FF9933', '#B84DFF'];

            wordsArray.forEach((wordObj, index) => {
                const el = document.createElement('div');
                el.className = 'cloud-word';
                el.innerText = wordObj.text;

                let fontSize = 20;
                let color = ppgColors[index % ppgColors.length];

                let textStrokeAndShadow = `
                    -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff,
                    4px 4px 0px #000
                `;

                if (index === 0) {
                    fontSize = 90;
                    color = '#FF3399';
                    textStrokeAndShadow = `
                        -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 3px 3px 0 #fff,
                        6px 6px 0px #000
                    `;
                } else {
                    if (wordObj.size === maxCount) {
                        fontSize = 55;
                    } else {
                        const ratio = maxCount === minCount ? 0 : (wordObj.size - minCount) / (maxCount - minCount);
                        if (ratio > 0.5) {
                            fontSize = 40;
                        } else if (ratio > 0.1) {
                            fontSize = 30;
                        } else {
                            fontSize = 22;
                        }
                    }
                }

                el.style.fontSize  = fontSize + 'px';
                el.style.color     = color;
                el.style.textShadow = textStrokeAndShadow;

                container.appendChild(el);
                const wordWidth  = el.offsetWidth;
                const wordHeight = el.offsetHeight;

                let finalX = centerX;
                let finalY = centerY;

                if (index === 0) {
                    finalX = centerX;
                    finalY = centerY;
                    placedBoxes.push({
                        left:   finalX - wordWidth  / 2 - HITBOX_PADDING,
                        right:  finalX + wordWidth  / 2 + HITBOX_PADDING,
                        top:    finalY - wordHeight / 2 - HITBOX_PADDING,
                        bottom: finalY + wordHeight / 2 + HITBOX_PADDING
                    });
                } else {
                    let angle  = index * 137.5 * (Math.PI / 180);
                    let radius = 15;
                    const step = 3;

                    while (true) {
                        let testX = centerX + radius * Math.cos(angle) * 1.5;
                        let testY = centerY + radius * Math.sin(angle);

                        let testBox = {
                            left:   testX - wordWidth  / 2 - HITBOX_PADDING,
                            right:  testX + wordWidth  / 2 + HITBOX_PADDING,
                            top:    testY - wordHeight / 2 - HITBOX_PADDING,
                            bottom: testY + wordHeight / 2 + HITBOX_PADDING
                        };

                        let isOverlapping = false;
                        for (let box of placedBoxes) {
                            if (!(testBox.right < box.left || testBox.left > box.right ||
                                  testBox.bottom < box.top || testBox.top > box.bottom)) {
                                isOverlapping = true;
                                break;
                            }
                        }

                        if (!isOverlapping || radius > Math.max(containerWidth, containerHeight)) {
                            finalX = testX;
                            finalY = testY;
                            placedBoxes.push(testBox);
                            break;
                        }

                        angle  += 0.5;
                        radius += step;
                    }
                }

                el.style.left = (finalX - wordWidth  / 2) + 'px';
                el.style.top  = (finalY - wordHeight / 2) + 'px';
            });
        }

        function updateLeaderboard(wordsArray) {
            const topContainer = document.getElementById('top-words');
            const sorted = [...wordsArray].sort((a, b) => b.size - a.size).slice(0, 5);

            if (sorted.length === 0) {
                topContainer.innerHTML = "TOP 5: AWAITING INPUTS...";
                return;
            }

            top
