<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Townhall Word Cloud</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-cloud/1.2.5/d3.layout.cloud.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-dark: #0a120b;
            --primary-green: #39ff14; 
            --dark-green: #0f5213;
            --mint-green: #98ff98;
            --accent-glow: rgba(57, 255, 20, 0.4);
            --pixel-border: 4px solid #39ff14;
        }

        * {
            box-sizing: border-box;
            font-family: 'Press Start 2P', monospace;
            image-rendering: pixelated;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--primary-green);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100vh;
            padding: 20px;
        }

        .active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #audience-screen {
            position: relative;
        }

        h1 {
            font-size: 1.3rem;
            text-align: center;
            text-shadow: 0 0 10px var(--accent-glow);
            margin-bottom: 10px;
        }

        #word-cloud-container {
            width: 90vw;
            height: 70vh;
            border: var(--pixel-border);
            box-shadow: 0 0 20px var(--accent-glow);
            background-color: rgba(10, 18, 11, 0.8);
            position: relative;
        }

        #top-words {
            margin-top: 15px;
            font-size: 0.65rem;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .top-tag {
            background: var(--dark-green);
            padding: 5px 10px;
            border: 2px solid var(--primary-green);
        }

        #admin-panel {
            position: absolute;
            bottom: 10px;
            right: 10px;
        }

        #mobile-screen {
            justify-content: flex-start;
            padding-top: 20%;
        }

        .card {
            border: var(--pixel-border);
            padding: 25px 15px;
            background: #000;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 8px 8px 0px var(--dark-green);
        }

        .instruction {
            font-size: 0.65rem;
            line-height: 1.5;
            margin-bottom: 25px;
            color: var(--mint-green);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 4px solid var(--mint-green);
            color: var(--primary-green);
            font-size: 0.8rem;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
        }

        input[type="text"]:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        button {
            background-color: var(--dark-green);
            color: white;
            border: 4px solid #fff;
            padding: 12px 24px;
            font-size: 0.75rem;
            cursor: pointer;
            box-shadow: 4px 4px 0px #fff;
            transition: transform 0.1s;
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #fff;
        }

        #submit-btn {
            width: 100%;
            background-color: var(--primary-green);
            color: #000;
            border-color: var(--mint-green);
            box-shadow: 4px 4px 0px var(--dark-green);
        }

        #reset-btn {
            font-size: 0.5rem;
            padding: 5px 10px;
            border-width: 2px;
            box-shadow: 2px 2px 0px #fff;
        }

        #feedback-msg {
            margin-top: 15px;
            font-size: 0.6rem;
            min-height: 15px;
        }

        @keyframes pixel-pop {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .word-node {
            animation: pixel-pop 0.35s ease-out both;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="audience-screen" class="screen">
        <h1>[ RETRO TOWNHALL CLOUD ]</h1>
        <div id="word-cloud-container"></div>
        <div id="top-words">TOP 5: Loading...</div>
        
        <div id="admin-panel">
            <button id="reset-btn" onclick="clearCloud()">RESET SYSTEM</button>
        </div>
    </div>

    <div id="mobile-screen" class="screen">
        <div class="card">
            <h1>ENTER WORD</h1>
            <p class="instruction">Submit your vibe in 1-2 words.<br>Spam filter is active!</p>
            <input type="text" id="word-input" maxlength="20" placeholder="Type here..." autofocus>
            <button id="submit-btn" onclick="sendWord()">SEND TO SCREEN</button>
            <div id="feedback-msg"></div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const SUPABASE_URL = "https://gslpqlnrupulptqntwvz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_qfy-lAoKfieXeU3jkgQ_4A_egK0DSrK";
        
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let wordCounts = {};
        let currentRole = "audience";

        function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role');
            
            if (role === 'mobile' || /Mobi|Android|iPhone/i.test(navigator.userAgent) && role !== 'tv') {
                currentRole = "mobile";
                document.getElementById('mobile-screen').classList.add('active');
                setupMobileInteractions();
            } else {
                currentRole = "audience";
                document.getElementById('audience-screen').classList.add('active');
                initAudienceCloud();
            }
        }

        async function initAudienceCloud() {
            const { data, error } = await db
                .from('word_cloud')
                .select('word');
            
            if (data) {
                data.forEach(row => {
                    const cleanWord = row.word.toUpperCase().trim();
                    wordCounts[cleanWord] = (wordCounts[cleanWord] || 0) + 1;
                });
                renderCloud();
            }

            db
                .channel('schema-db-changes')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'word_cloud' }, payload => {
                    const newWord = payload.new.word.toUpperCase().trim();
                    wordCounts[newWord] = (wordCounts[newWord] || 0) + 1;
                    renderCloud();
                })
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'word_cloud' }, () => {
                    wordCounts = {};
                    renderCloud();
                })
                .subscribe();
        }

        // --- VISUALIZATION ENGINE ---
        function renderCloud() {
            const container = document.getElementById('word-cloud-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            container.innerHTML = "";

            // 依據字頻從大到小排序
            const wordsArray = Object.keys(wordCounts).map(word => ({
                text: word,
                size: wordCounts[word]
            })).sort((a, b) => b.size - a.size);

            updateLeaderboard(wordsArray);

            if(wordsArray.length === 0) return;

            const maxCount = d3.max(wordsArray, d => d.size);
            const minCount = d3.min(wordsArray, d => d.size);
            
            // 🛠️ 核心優化：動態天花板機制。
            // 如果目前總詞彙數很少（小於 15 個），最大字體限制在安全的 65px，絕對不擠爆版面。
            // 當詞彙變多、空間被填滿時，上限會自動解鎖放大到 120px！
            const wordCountLength = wordsArray.length;
            const maxFontLimit = wordCountLength < 15 ? 65 : Math.min(120, 60 + wordCountLength * 3);
            
            const sizeScale = (maxCount === minCount) 
                ? () => 40 
                : d3.scaleLinear().domain([minCount, maxCount]).range([18, maxFontLimit]);

            const layout = d3.layout.cloud()
                .size([width, height])
                .words(wordsArray)
                .padding(2) // 最安全的緊密排列間距
                .rotate(() => 0) 
                .font("'Press Start 2P', monospace")
                .fontSize(d => sizeScale(d.size))
                .spiral("archimedean") // 阿基米德引力居中
                .on("end", draw);

            layout.start();

            function draw(words) {
                // 終極備援：如果 D3 依然放不下（words長度為0或沒有x座標），直接強制進入備援模式，永不全黑！
                if (words.length === 0 || !words[0].hasOwnProperty('x')) {
                    fallbackRender(wordsArray, container, maxCount, minCount);
                    return;
                }

                // 🛠️ 視覺優化：加強主角光環的顯色與發光特效
                const getColorAndGlow = (dSize, max, min) => {
                    if (max === min || dSize === max) {
                        // 👑 第一名絕對主角：白芯 + 螢光綠超強三層外發光
                        return { color: '#ffffff', glow: '0 0 10px #39ff14, 0 0 20px #39ff14, 3px 3px 0px #000' };
                    }
                    const ratio = (dSize - min) / (max - min);
                    if (ratio > 0.6) {
                        // 第二名：高亮螢光綠
                        return { color: '#39ff14', glow: '0 0 5px rgba(57,255,20,0.5), 2px 2px 0px #000' };
                    } else if (ratio > 0.2) {
                        // 一般詞：薄荷嫩綠
                        return { color: '#98ff98', glow: '2px 2px 0px #000' };
                    } else {
                        // 背景詞：低調深綠
                        return { color: '#228b22', glow: '1px 1px 0px #000' };
                    }
                };

                d3.select("#word-cloud-container").append("svg")
                    .attr("width", layout.size()[0])
                    .attr("height", layout.size()[1])
                  .append("g")
                    .attr("transform", "translate(" + layout.size()[0] / 2 + "," + layout.size()[1] / 2 + ")")
                  .selectAll("text")
                    .data(words)
                  .enter().append("text")
                    .attr("class", "word-node")
                    .style("font-size", d => d.size + "px")
                    .attr("text-anchor", "middle")
                    .attr("transform", d => "translate(" + [d.x, d.y] + ")")
                    .style("fill", d => getColorAndGlow(d.size, maxCount, minCount).color)
                    .style("text-shadow", d => getColorAndGlow(d.size, maxCount, minCount).glow)
                    .text(d => d.text);
            }
        }

        // 彈性備援網格排版系統（保證 100% 呈現畫面）
        function fallbackRender(words, container, max, min) {
            container.style.display = "flex";
            container.style.flexWrap = "wrap";
            container.style.alignItems = "center";
            container.style.justifyContent = "center";
            container.style.padding = "30px";
            container.style.gap = "20px";

            words.forEach(w => {
                const span = document.createElement("span");
                span.className = "word-node";
                span.innerText = w.text;
                
                let size = 20;
                let color = "#228b22";
                let shadow = "2px 2px 0px #000";

                if (max === min || w.size === max) {
                    size = 55; color = "#ffffff"; shadow = "0 0 15px #39ff14, 3px 3px 0px #000";
                } else if ((w.size - min) / (max - min) > 0.5) {
                    size = 35; color = "#39ff14"; shadow = "2px 2px 0px #000";
                } else {
                    size = 24; color = "#98ff98";
                }

                span.style.fontSize = size + "px";
                span.style.color = color;
                span.style.textShadow = shadow;
                container.appendChild(span);
            });
        }

        function updateLeaderboard(wordsArray) {
            const topContainer = document.getElementById('top-words');
            const sorted = [...wordsArray].sort((a, b) => b.size - a.size).slice(0, 5);
            
            if(sorted.length === 0) {
                topContainer.innerHTML = "TOP 5: AWAITING INPUTS...";
                return;
            }

            topContainer.innerHTML = "TOP 5: " + sorted.map(w => `<span class="top-tag">${w.text} (${w.size})</span>`).join(" ");
        }

        async function sendWord() {
            const inputElement = document.getElementById('word-input');
            const feedback = document.getElementById('feedback-msg');
            let rawWord = inputElement.value.trim();

            if (!rawWord) return;
            
            if (rawWord.split(/\s+/).length > 2) {
                feedback.style.color = "red";
                feedback.innerText = "CRITICAL: MAX 2 WORDS!";
                return;
            }

            const lastSubmissionTime = localStorage.getItem('last_sub_time');
            const cooldownPeriod = 5000; 

            if (lastSubmissionTime && (Date.now() - lastSubmissionTime < cooldownPeriod)) {
                feedback.style.color = "yellow";
                feedback.innerText = "COOLDOWN ACTIVE. WAIT SYSTEM COOLING...";
                return;
            }

            const { error } = await db
                .from('word_cloud')
                .insert([{ word: rawWord }]);

            if (!error) {
                localStorage.setItem('last_sub_time', Date.now());
                feedback.style.color = "#39ff14"; 
                feedback.innerText = "WORD BROADCASTED SUCCESSFULLY!";
                inputElement.value = "";
                
                if(navigator.vibrate) navigator.vibrate(50); 
            } else {
                feedback.style.color = "red";
                feedback.innerText = "TRANSMISSION ERROR.";
            }
        }

        async function clearCloud() {
            if (confirm("Wipe entire database canvas for next round?")) {
                const { error } = await db
                    .from('word_cloud')
                    .delete()
                    .neq('word', 'placeholder_wiping_trick'); 
            }
        }

        function setupMobileInteractions() {
            document.getElementById('word-input').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') sendWord();
            });
        }

        window.onload = initApp;
    </script>
</body>
</html>
