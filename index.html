<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Townhall Word Cloud</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-dark: #0a120b;
            --primary-green: #39ff14; 
            --dark-green: #0f5213;
            --mint-green: #98ff98;
            --accent-glow: rgba(57, 255, 20, 0.4);
            --pixel-border: 4px solid #39ff14;
        }

        * {
            box-sizing: border-box;
            font-family: 'Press Start 2P', monospace;
            image-rendering: pixelated;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--primary-green);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999;
            pointer-events: none;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100vh;
            padding: 20px;
        }

        .active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #audience-screen {
            position: relative;
        }

        h1 {
            font-size: 1.3rem;
            text-align: center;
            text-shadow: 0 0 10px var(--accent-glow);
            margin-bottom: 10px;
        }

        #word-cloud-container {
            width: 90vw;
            height: 70vh;
            border: var(--pixel-border);
            box-shadow: 0 0 20px var(--accent-glow);
            background-color: rgba(10, 18, 11, 0.8);
            position: relative;
            overflow: hidden;
        }

        #top-words {
            margin-top: 15px;
            font-size: 0.65rem;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .top-tag {
            background: var(--dark-green);
            padding: 5px 10px;
            border: 2px solid var(--primary-green);
        }

        #admin-panel {
            position: absolute;
            bottom: 10px;
            right: 10px;
            z-index: 100;
        }

        #mobile-screen {
            justify-content: flex-start;
            padding-top: 20%;
        }

        .card {
            border: var(--pixel-border);
            padding: 25px 15px;
            background: #000;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 8px 8px 0px var(--dark-green);
        }

        .instruction {
            font-size: 0.65rem;
            line-height: 1.5;
            margin-bottom: 25px;
            color: var(--mint-green);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 4px solid var(--mint-green);
            color: var(--primary-green);
            font-size: 0.8rem;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
        }

        button {
            background-color: var(--dark-green);
            color: white;
            border: 4px solid #fff;
            padding: 12px 24px;
            font-size: 0.75rem;
            cursor: pointer;
            box-shadow: 4px 4px 0px #fff;
            transition: transform 0.1s;
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #fff;
        }

        #submit-btn {
            width: 100%;
            background-color: var(--primary-green);
            color: #000;
            border-color: var(--mint-green);
            box-shadow: 4px 4px 0px var(--dark-green);
        }

        #reset-btn {
            font-size: 0.5rem;
            padding: 5px 10px;
            border-width: 2px;
            box-shadow: 2px 2px 0px #fff;
        }

        #feedback-msg {
            margin-top: 15px;
            font-size: 0.6rem;
            min-height: 15px;
        }

        /* 🛠️ 修改了動畫：拔除 transform: translate(-50%,-50%) 避免干擾 Hitbox 計算 */
        @keyframes pixel-pop {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .cloud-word {
            position: absolute;
            white-space: nowrap;
            text-align: center;
            transform-origin: center;
            animation: pixel-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
    </style>
</head>
<body>

    <div id="audience-screen" class="screen">
        <h1>[ RETRO TOWNHALL CLOUD ]</h1>
        <div id="word-cloud-container"></div>
        <div id="top-words">TOP 5: Loading...</div>
        
        <div id="admin-panel">
            <button id="reset-btn" onclick="clearCloud()">RESET SYSTEM</button>
        </div>
    </div>

    <div id="mobile-screen" class="screen">
        <div class="card">
            <h1>ENTER WORD</h1>
            <p class="instruction">Submit your vibe in 1-2 words.<br>Spam filter is active!</p>
            <input type="text" id="word-input" maxlength="20" placeholder="Type here..." autofocus>
            <button id="submit-btn" onclick="sendWord()">SEND TO SCREEN</button>
            <div id="feedback-msg"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://gslpqlnrupulptqntwvz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_qfy-lAoKfieXeU3jkgQ_4A_egK0DSrK";
        
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let wordCounts = {};
        let currentRole = "audience";

        function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role');
            
            if (role === 'mobile' || /Mobi|Android|iPhone/i.test(navigator.userAgent) && role !== 'tv') {
                currentRole = "mobile";
                document.getElementById('mobile-screen').classList.add('active');
                setupMobileInteractions();
            } else {
                currentRole = "audience";
                document.getElementById('audience-screen').classList.add('active');
                initAudienceCloud();
            }
        }

        function initAudienceCloud() {
            db.from('word_cloud').select('word')
                .then(({ data, error }) => {
                    wordCounts = {};
                    if (data && data.length > 0) {
                        data.forEach(row => {
                            if (row.word) {
                                const cleanWord = row.word.toUpperCase().trim();
                                wordCounts[cleanWord] = (wordCounts[cleanWord] || 0) + 1;
                            }
                        });
                    }
                    renderCloud(); 
                });

            db.channel('schema-db-changes')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'word_cloud' }, payload => {
                    if (payload.new && payload.new.word) {
                        const newWord = payload.new.word.toUpperCase().trim();
                        wordCounts[newWord] = (wordCounts[newWord] || 0) + 1;
                        renderCloud();
                    }
                })
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'word_cloud' }, () => {
                    wordCounts = {};
                    renderCloud();
                })
                .subscribe();
        }

        // --- 🚀 全新升級：帶有 Hitbox 碰撞偵測的排版引擎 ---
        function renderCloud() {
            const container = document.getElementById('word-cloud-container');
            container.innerHTML = "";

            const wordsArray = Object.keys(wordCounts).map(word => ({
                text: word,
                size: wordCounts[word]
            })).sort((a, b) => b.size - a.size);

            updateLeaderboard(wordsArray);

            if (wordsArray.length === 0) return;

            const maxCount = Math.max(...wordsArray.map(w => w.size));
            const minCount = Math.min(...wordsArray.map(w => w.size));

            // 取得畫布的寬高與正中心座標
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            const centerX = containerWidth / 2;
            const centerY = containerHeight / 2;

            // 存放已經放置成功的 Hitbox
            const placedBoxes = [];
            // 設定每個字周圍的保護間隔 (Hitbox Padding)
            const HITBOX_PADDING = 10; 

            wordsArray.forEach((wordObj, index) => {
                const el = document.createElement('div');
                el.className = 'cloud-word';
                el.innerText = wordObj.text;

                let fontSize = 20;
                let color = '#39ff14';
                let textShadow = '2px 2px 0px #000';

                // 決定大小與顏色
                if (index === 0) {
                    fontSize = 85; 
                    color = '#ffffff'; 
                    textShadow = '0 0 15px #39ff14, 0 0 35px #39ff14, 4px 4px 0px #000'; 
                } else {
                    if (wordObj.size === maxCount) {
                        fontSize = 48;
                        color = '#39ff14';
                        textShadow = '0 0 8px #39ff14, 3px 3px 0px #000';
                    } else {
                        const ratio = maxCount === minCount ? 0 : (wordObj.size - minCount) / (maxCount - minCount);
                        if (ratio > 0.5) {
                            fontSize = 36;
                            color = '#ffffff';
                            textShadow = '0 0 5px #39ff14, 2px 2px 0px #000';
                        } else if (ratio > 0.1) {
                            fontSize = 26;
                            color = '#98ff98';
                            textShadow = '2px 2px 0px #000';
                        } else {
                            fontSize = 20;
                            color = '#39ff14';
                            textShadow = '2px 2px 0px #000';
                        }
                    }
                }

                el.style.fontSize = fontSize + 'px';
                el.style.color = color;
                el.style.textShadow = textShadow;

                // 先將元素加進畫面，藉此量測它真正的寬度與高度 (Hitbox 尺寸)
                container.appendChild(el);
                const wordWidth = el.offsetWidth;
                const wordHeight = el.offsetHeight;

                let finalX = centerX;
                let finalY = centerY;

                // 👑 第一名直接鎖死正中央，不需找位子
                if (index === 0) {
                    finalX = centerX;
                    finalY = centerY;
                    placedBoxes.push({
                        left: finalX - wordWidth / 2 - HITBOX_PADDING,
                        right: finalX + wordWidth / 2 + HITBOX_PADDING,
                        top: finalY - wordHeight / 2 - HITBOX_PADDING,
                        bottom: finalY + wordHeight / 2 + HITBOX_PADDING
                    });
                } else {
                    // 📡 碰撞偵測螺旋演算法 (AABB Collision)
                    let angle = index * 137.5 * (Math.PI / 180); // 使用黃金角開始
                    let radius = 10;
                    let step = 3; // 每次往外擴展的像素

                    while (true) {
                        // 1.5倍的 X 軸加成，讓擴展更符合 16:9 的螢幕比例
                        let testX = centerX + radius * Math.cos(angle) * 1.5;
                        let testY = centerY + radius * Math.sin(angle);

                        // 建立這個測試座標的 Hitbox
                        let testBox = {
                            left: testX - wordWidth / 2 - HITBOX_PADDING,
                            right: testX + wordWidth / 2 + HITBOX_PADDING,
                            top: testY - wordHeight / 2 - HITBOX_PADDING,
                            bottom: testY + wordHeight / 2 + HITBOX_PADDING
                        };

                        // 檢查是否與任何已經擺放好的 Hitbox 發生重疊
                        let isOverlapping = false;
                        for (let box of placedBoxes) {
                            // AABB 碰撞公式判斷
                            if (!(testBox.right < box.left || 
                                  testBox.left > box.right || 
                                  testBox.bottom < box.top || 
                                  testBox.top > box.bottom)) {
                                isOverlapping = true;
                                break;
                            }
                        }

                        // 防呆機制：如果螺旋向外找了太遠 (大於畫布對角線)，直接強制放下避免無窮迴圈
                        if (!isOverlapping || radius > Math.max(containerWidth, containerHeight)) {
                            finalX = testX;
                            finalY = testY;
                            placedBoxes.push(testBox); // 紀錄這個成功的 Hitbox
                            break;
                        }

                        // 如果重疊了，轉一點角度並往外推一點點，繼續找位子！
                        angle += 0.5;
                        radius += step;
                    }
                }

                // 最終計算出來的座標，套用到元素的絕對定位上 (扣除自身寬高的一半以達到中心點對齊)
                el.style.left = (finalX - wordWidth / 2) + 'px';
                el.style.top = (finalY - wordHeight / 2) + 'px';
            });
        }

        function updateLeaderboard(wordsArray) {
            const topContainer = document.getElementById('top-words');
            const sorted = [...wordsArray].sort((a, b) => b.size - a.size).slice(0, 5);
            
            if(sorted.length === 0) {
                topContainer.innerHTML = "TOP 5: AWAITING INPUTS...";
                return;
            }

            topContainer.innerHTML = "TOP 5: " + sorted.map(w => `<span class="top-tag">${w.text} (${w.size})</span>`).join(" ");
        }

        async function sendWord() {
            const inputElement = document.getElementById('word-input');
            const feedback = document.getElementById('feedback-msg');
            let rawWord = inputElement.value.trim();

            if (!rawWord) return;
            
            if (rawWord.split(/\s+/).length > 2) {
                feedback.style.color = "red";
                feedback.innerText = "CRITICAL: MAX 2 WORDS!";
                return;
            }

            const lastSubmissionTime = localStorage.getItem('last_sub_time');
            const cooldownPeriod = 5000; 

            if (lastSubmissionTime && (Date.now() - lastSubmissionTime < cooldownPeriod)) {
                feedback.style.color = "yellow";
                feedback.innerText = "COOLDOWN ACTIVE. WAIT SYSTEM COOLING...";
                return;
            }

            const { error } = await db
                .from('word_cloud')
                .insert([{ word: rawWord }]);

            if (!error) {
                localStorage.setItem('last_sub_time', Date.now());
                feedback.style.color = "#39ff14"; 
                feedback.innerText = "WORD BROADCASTED SUCCESSFULLY!";
                inputElement.value = "";
                
                if(navigator.vibrate) navigator.vibrate(50); 
            } else {
                feedback.style.color = "red";
                feedback.innerText = "TRANSMISSION ERROR.";
            }
        }

        async function clearCloud() {
            if (confirm("Wipe entire database canvas for next round?")) {
                const { error } = await db
                    .from('word_cloud')
                    .delete()
                    .neq('word', 'placeholder_wiping_trick'); 
            }
        }

        function setupMobileInteractions() {
            document.getElementById('word-input').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') sendWord();
            });
        }

        window.onload = initApp;
    </script>
</body>
</html>
