<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Townhall Word Cloud</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-dark: #0a120b;
            --primary-green: #39ff14; 
            --dark-green: #0f5213;
            --mint-green: #98ff98;
            --accent-glow: rgba(57, 255, 20, 0.4);
            --pixel-border: 4px solid #39ff14;
        }

        * {
            box-sizing: border-box;
            font-family: 'Press Start 2P', monospace;
            image-rendering: pixelated;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--primary-green);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100vh;
            padding: 20px;
        }

        .active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #audience-screen {
            position: relative;
        }

        h1 {
            font-size: 1.3rem;
            text-align: center;
            text-shadow: 0 0 10px var(--accent-glow);
            margin-bottom: 10px;
        }

        #word-cloud-container {
            width: 90vw;
            height: 70vh;
            border: var(--pixel-border);
            box-shadow: 0 0 20px var(--accent-glow);
            background-color: rgba(10, 18, 11, 0.8);
            position: relative; /* 啟用絕對定位子元素的母體基底 */
            overflow: hidden;
        }

        #top-words {
            margin-top: 15px;
            font-size: 0.65rem;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .top-tag {
            background: var(--dark-green);
            padding: 5px 10px;
            border: 2px solid var(--primary-green);
        }

        #admin-panel {
            position: absolute;
            bottom: 10px;
            right: 10px;
            z-index: 100;
        }

        #mobile-screen {
            justify-content: flex-start;
            padding-top: 20%;
        }

        .card {
            border: var(--pixel-border);
            padding: 25px 15px;
            background: #000;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 8px 8px 0px var(--dark-green);
        }

        .instruction {
            font-size: 0.65rem;
            line-height: 1.5;
            margin-bottom: 25px;
            color: var(--mint-green);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 4px solid var(--mint-green);
            color: var(--primary-green);
            font-size: 0.8rem;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
        }

        input[type="text"]:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        button {
            background-color: var(--dark-green);
            color: white;
            border: 4px solid #fff;
            padding: 12px 24px;
            font-size: 0.75rem;
            cursor: pointer;
            box-shadow: 4px 4px 0px #fff;
            transition: transform 0.1s;
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #fff;
        }

        #submit-btn {
            width: 100%;
            background-color: var(--primary-green);
            color: #000;
            border-color: var(--mint-green);
            box-shadow: 4px 4px 0px var(--dark-green);
        }

        #reset-btn {
            font-size: 0.5rem;
            padding: 5px 10px;
            border-width: 2px;
            box-shadow: 2px 2px 0px #fff;
        }

        #feedback-msg {
            margin-top: 15px;
            font-size: 0.6rem;
            min-height: 15px;
        }

        @keyframes pixel-pop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            70% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .cloud-word {
            position: absolute;
            white-space: nowrap;
            text-align: center;
            transform-origin: center;
            animation: pixel-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
    </style>
</head>
<body>

    <div id="audience-screen" class="screen">
        <h1>[ RETRO TOWNHALL CLOUD ]</h1>
        <div id="word-cloud-container"></div>
        <div id="top-words">TOP 5: Loading...</div>
        
        <div id="admin-panel">
            <button id="reset-btn" onclick="clearCloud()">RESET SYSTEM</button>
        </div>
    </div>

    <div id="mobile-screen" class="screen">
        <div class="card">
            <h1>ENTER WORD</h1>
            <p class="instruction">Submit your vibe in 1-2 words.<br>Spam filter is active!</p>
            <input type="text" id="word-input" maxlength="20" placeholder="Type here..." autofocus>
            <button id="submit-btn" onclick="sendWord()">SEND TO SCREEN</button>
            <div id="feedback-msg"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://gslpqlnrupulptqntwvz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_qfy-lAoKfieXeU3jkgQ_4A_egK0DSrK";
        
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let wordCounts = {};
        let currentRole = "audience";

        function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role');
            
            if (role === 'mobile' || /Mobi|Android|iPhone/i.test(navigator.userAgent) && role !== 'tv') {
                currentRole = "mobile";
                document.getElementById('mobile-screen').classList.add('active');
                setupMobileInteractions();
            } else {
                currentRole = "audience";
                document.getElementById('audience-screen').classList.add('active');
                initAudienceCloud();
            }
        }

        async function initAudienceCloud() {
            const { data, error } = await db
                .from('word_cloud')
                .select('word');
            
            if (data) {
                data.forEach(row => {
                    const cleanWord = row.word.toUpperCase().trim();
                    wordCounts[cleanWord] = (wordCounts[cleanWord] || 0) + 1;
                });
                renderCloud();
            }

            db
                .channel('schema-db-changes')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'word_cloud' }, payload => {
                    const newWord = payload.new.word.toUpperCase().trim();
                    wordCounts[newWord] = (wordCounts[newWord] || 0) + 1;
                    renderCloud();
                })
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'word_cloud' }, () => {
                    wordCounts = {};
                    renderCloud();
                })
                .subscribe();
        }

        // --- 100% 穩定不重疊的雷達放射狀排版引擎 ---
        function renderCloud() {
            const container = document.getElementById('word-cloud-container');
            container.innerHTML = "";

            // 將資料從大到小嚴格排序
            const wordsArray = Object.keys(wordCounts).map(word => ({
                text: word,
                size: wordCounts[word]
            })).sort((a, b) => b.size - a.size);

            updateLeaderboard(wordsArray);

            if (wordsArray.length === 0) return;

            const maxCount = wordsArray[0].size;
            const minCount = wordsArray[wordsArray.length - 1].size;

            wordsArray.forEach((wordObj, index) => {
                const el = document.createElement('div');
                el.className = 'cloud-word';
                el.innerText = wordObj.text;

                let fontSize = 24;
                let color = '#228b22';
                let textShadow = '2px 2px 0px #000';
                let leftPercent = 50;
                let topPercent = 50;

                // 👑 邏輯 1：如果是最高頻的主角，直接錨定在正中心
                if (index === 0) {
                    fontSize = 80; // 統治級大尺寸
                    color = '#ffffff'; // 白芯
                    textShadow = '0 0 15px #39ff14, 0 0 30px #39ff14, 4px 4px 0px #000'; // 超強發光
                    leftPercent = 50;
                    topPercent = 50;
                } else {
                    // 📡 邏輯 2：配角們依照順序，利用雷達軌道半徑與角度公式往外擴散
                    // 軌道半徑隨數量逐漸加大，角度均勻錯開
                    let radius;
                    if (index <= 4) {
                        radius = 20; // 內圈軌道半徑 (vw/vh)
                    } else if (index <= 10) {
                        radius = 32; // 中圈軌道半徑
                    } else {
                        radius = 42; // 外圈軌道半徑
                    }

                    // 均勻分佈角度 (弧度制)
                    const angle = (index * 135) * (Math.PI / 180); // 使用黃金角度乘積避免在同一直線上
                    
                    // 考量到大螢幕是 16:9 寬螢幕，X軸(水平)乘上 1.45 倍係數拉開，避免視覺擁擠
                    leftPercent = 50 + (radius * Math.cos(angle) * 1.45);
                    topPercent = 50 + (radius * Math.sin(angle));

                    // 限制邊界防呆，不超出框線
                    leftPercent = Math.max(12, Math.min(88, leftPercent));
                    topPercent = Math.max(12, Math.min(88, topPercent));

                    // 計算配角們的字體階層與顏色
                    if (wordObj.size === maxCount) {
                        fontSize = 55;
                        color = '#39ff14';
                        textShadow = '0 0 8px #39ff14, 3px 3px 0px #000';
                    } else {
                        const ratio = maxCount === minCount ? 0 : (wordObj.size - minCount) / (maxCount - minCount);
                        if (ratio > 0.5) {
                            fontSize = 38;
                            color = '#98ff98';
                            textShadow = '3px 3px 0px #000';
                        } else if (ratio > 0.1) {
                            fontSize = 26;
                            color = '#228b22';
                        } else {
                            fontSize = 18;
                            color = '#0f5213';
                        }
                    }
                }

                // 套用絕對定位樣式
                el.style.fontSize = fontSize + 'px';
                el.style.color = color;
                el.style.textShadow = textShadow;
                el.style.left = leftPercent + '%';
                el.style.top = topPercent + '%';

                container.appendChild(el);
            });
        }

        function updateLeaderboard(wordsArray) {
            const topContainer = document.getElementById('top-words');
            const sorted = [...wordsArray].sort((a, b) => b.size - a.size).slice(0, 5);
            
            if(sorted.length === 0) {
                topContainer.innerHTML = "TOP 5: AWAITING INPUTS...";
                return;
            }

            topContainer.innerHTML = "TOP 5: " + sorted.map(w => `<span class="top-tag">${w.text} (${w.size})</span>`).join(" ");
        }

        async function sendWord() {
            const inputElement = document.getElementById('word-input');
            const feedback = document.getElementById('feedback-msg');
            let rawWord = inputElement.value.trim();

            if (!rawWord) return;
            
            if (rawWord.split(/\s+/).length > 2) {
                feedback.style.color = "red";
                feedback.innerText = "CRITICAL: MAX 2 WORDS!";
                return;
            }

            const lastSubmissionTime = localStorage.getItem('last_sub_time');
            const cooldownPeriod = 5000; 

            if (lastSubmissionTime && (Date.now() - lastSubmissionTime < cooldownPeriod)) {
                feedback.style.color = "yellow";
                feedback.innerText = "COOLDOWN ACTIVE. WAIT SYSTEM COOLING...";
                return;
            }

            const { error } = await db
                .from('word_cloud')
                .insert([{ word: rawWord }]);

            if (!error) {
                localStorage.setItem('last_sub_time', Date.now());
                feedback.style.color = "#39ff14"; 
                feedback.innerText = "WORD BROADCASTED SUCCESSFULLY!";
                inputElement.value = "";
                
                if(navigator.vibrate) navigator.vibrate
